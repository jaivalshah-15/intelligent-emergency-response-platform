services:
  db:
    image: postgres:16
    container_name: emergency-db
    environment:
      POSTGRES_USER: emergency
      POSTGRES_PASSWORD: emergency123
      POSTGRES_DB: emergency_db
    ports:
      - "5432:5432"
    volumes:
      - emergency_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emergency -d emergency_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: emergency-backend
    environment:
      DATABASE_URL: postgresql+psycopg://emergency:emergency123@db:5432/emergency_db
      FRONTEND_URLS: http://localhost:5173,http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: emergency-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  emergency_pgdata: